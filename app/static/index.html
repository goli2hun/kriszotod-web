<!doctype html>
<html lang="hu" data-theme="midnight">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ÖTÖDÖLŐ</title>
  <meta name="description" content="Modern webes Ötödölő játék" />
  <link rel="stylesheet" href="/static/css/base.css" />
  <link rel="stylesheet" href="/static/css/themes.css" />
</head>
<body>
  <div class="global-controls" aria-label="Megjelenés és hang">
    <button id="soundToggle" class="theme-button compact-control" type="button" aria-label="Hang kikapcsolása" title="Hang kikapcsolása">
      <span id="soundToggleIcon" class="theme-button-icon" aria-hidden="true">🔊</span>
      <span id="soundToggleText">HANG</span>
    </button>

    <button id="themeToggle" class="theme-button compact-control" type="button" aria-label="Design váltása" title="Design váltása">
      <span id="themeToggleIcon" class="theme-button-icon" aria-hidden="true">☀</span>
      <span id="themeToggleText">VILÁGOS</span>
    </button>
  </div>

  <section id="loginView" class="auth-view">
    <div class="login-card">
      <div class="login-mark" aria-hidden="true">
        <span class="mini-piece red"></span>
        <span class="mini-piece blue"></span>
      </div>

      <p class="eyebrow">KRISZOTOD</p>
      <h1 class="login-title">ÖTÖDÖLŐ</h1>
      <p class="login-subtitle">Jelentkezz be a játékhoz</p>

      <form id="loginForm" class="login-form">
        <label class="form-field">
          <span>Felhasználónév</span>
          <input id="usernameInput" name="username" type="text" autocomplete="username" required />
        </label>

        <label class="form-field">
          <span>Jelszó</span>
          <input id="passwordInput" name="password" type="password" autocomplete="current-password" required />
        </label>

        <p id="loginError" class="login-error hidden" role="alert"></p>

        <button id="loginButton" class="primary-button login-button" type="submit">
          BELÉPÉS
        </button>
      </form>

      <p class="login-footnote">kriszotod.duckdns.org</p>
    </div>
  </section>

  <main id="gameView" class="app-shell hidden">
    <header class="topbar">
      <div class="brand-block">
        <p class="eyebrow">KRISZOTOD</p>
        <h1>ÖTÖDÖLŐ</h1>
        <p class="subtitle">A stratégia játéka</p>
      </div>

      <div class="session-chip">
        <span class="session-dot"></span>
        <span id="currentUsername">—</span>
      </div>
    </header>

    <section class="game-layout">
      <aside id="redPlayerCard" class="player-card player-red active">
        <div class="portrait-frame portrait-red">
          <img class="player-portrait" src="/static/assets/portraits/player-red.svg" alt="Piros játékos, női karakter" />
        </div>
        <div class="player-copy">
          <span class="player-label">PIROS</span>
          <small>Játékos 1</small>
        </div>
      </aside>

      <section class="board-panel">
        <div class="coordinates columns" id="columnLabels"></div>
        <div class="board-row">
          <div class="coordinates rows" id="rowLabels"></div>
          <div id="board" class="board turn-red" aria-label="10x10 Ötödölő tábla"></div>
        </div>
        <div id="statusPill" class="status-pill">
          <span id="statusDot" class="status-dot red"></span>
          <span>Következik: <strong id="statusText">PIROS</strong></span>
        </div>
      </section>

      <aside id="bluePlayerCard" class="player-card player-blue">
        <div class="portrait-frame portrait-blue">
          <img class="player-portrait" src="/static/assets/portraits/player-blue.svg" alt="Kék játékos, férfi karakter" />
        </div>
        <div class="player-copy">
          <span class="player-label">KÉK</span>
          <small>Játékos 2</small>
        </div>
      </aside>
    </section>

    <section class="actions">
      <button id="newGameButton" class="primary-button" type="button">↻ ÚJ JÁTÉK</button>
      <button id="logoutButton" class="secondary-button" type="button">KIJELENTKEZÉS</button>
    </section>

    <p class="hint">A jobb felső vezérlőkkel válthatsz designt és némíthatod a játékot.</p>
  </main>

  <div id="gameOver" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="winnerText">
    <div class="modal-card">
      <p class="eyebrow">ÖTÖDÖLŐ!</p>
      <div class="winner-badge">
        <span id="winnerDot" class="status-dot red"></span>
        <span id="winnerSubtitle">ÖT EGYMÁS MELLETT</span>
      </div>
      <h2 id="winnerText">PIROS NYERT!</h2>
      <button id="modalNewGameButton" class="primary-button" type="button">ÚJ JÁTÉK</button>
    </div>
  </div>

  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
