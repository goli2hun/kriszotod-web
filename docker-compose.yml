services:
  otodolo:
    build: .
    container_name: kriszotod-web
    ports:
      - "8030:8030"
    environment:
      OTODOLO_DB_PATH: /data/otodolo.db
    volumes:
      - kriszotod-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8030/api/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  kriszotod-data:
